services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guestmode-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      DB_PATH: /app/storage/bot.db
    volumes:
      - bot_data:/app/storage
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
